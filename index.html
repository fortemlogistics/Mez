<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Spec Inspector - Step-by-Step Snippet Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
    <div class="flex items-center gap-4">
      <h1 class="text-base font-bold text-blue-400">PCB Spec Inspector</h1>
      <input type="file" id="zipInput" accept=".zip" class="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-400">Upload fabrication zip...</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="scanBtn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-semibold transition shadow-md shadow-blue-900/40">
        Run Extraction
      </button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    
    <section class="flex-1 flex flex-col items-center justify-center p-8 bg-slate-950/80 border-r border-slate-800 relative">
      <div id="snippetPlaceholder" class="text-slate-500 text-sm italic">
        Upload a zip file and click "Run Extraction" to generate snippets.
      </div>
      
      <div id="canvasWrapper" class="hidden flex flex-col items-center max-w-full max-h-full">
        <canvas id="snippetCanvas" class="shadow-2xl rounded-lg border-2 border-emerald-500/70 bg-white max-h-[75vh] max-w-[90%] object-contain"></canvas>
        <p class="text-[11px] text-slate-400 mt-2 italic">Cropped direct from fabrication drawing</p>
      </div>

      <canvas id="offscreenCanvas" class="hidden"></canvas>
    </section>

    <aside class="w-[440px] p-8 flex flex-col justify-between bg-slate-900">
      
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-6">
          <span id="stepCounter" class="text-xs font-mono uppercase tracking-wider text-slate-400">Spec 0 of 0</span>
          <span id="specCategory" class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">--</span>
        </div>

        <div class="space-y-5">
          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Parameter</span>
            <h2 id="specLabel" class="text-lg font-bold text-white mt-0.5">--</h2>
          </div>

          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Suggested Value</span>
            <div id="specValue" class="text-xl font-mono text-emerald-400 font-semibold mt-1 p-3 bg-slate-950 rounded border border-slate-800">
              --
            </div>
          </div>

          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Verbatim Reference Quote</span>
            <blockquote id="specSnippet" class="mt-1 p-3 bg-slate-950 border-l-2 border-emerald-400 text-xs italic text-slate-300 rounded-r">
              No scan performed yet.
            </blockquote>
          </div>
        </div>
      </div>

      <footer class="pt-6 border-t border-slate-800 flex items-center justify-between gap-4">
        <button id="prevBtn" disabled class="flex-1 py-2 px-4 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 text-xs font-semibold rounded border border-slate-700 transition">
          ← Previous
        </button>
        <button id="nextBtn" disabled class="flex-1 py-2 px-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 text-xs font-semibold rounded transition shadow-lg shadow-blue-900/30">
          Next →
        </button>
      </footer>

    </aside>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let fullImageBase64 = null;
    let specList = [];
    let currentIndex = 0;

    const offscreenCanvas = document.getElementById('offscreenCanvas');
    const snippetCanvas = document.getElementById('snippetCanvas');
    const API_KEY = localStorage.getItem('gemini_api_key') || "";

    // 1. Unpack Zip and Render Full PDF Page to Offscreen Canvas
    document.getElementById('zipInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('status').innerText = 'Unpacking zip...';
      const zip = await JSZip.loadAsync(file);

      const pdfEntry = Object.values(zip.files).find(f => 
        f.name.toLowerCase().endsWith('.pdf') && 
        (f.name.toLowerCase().includes('fab') || f.name.toLowerCase().includes('drawing') || f.name.toLowerCase().includes('dwg'))
      ) || Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.pdf'));

      if (!pdfEntry) {
        document.getElementById('status').innerText = 'No PDF found in zip.';
        return;
      }

      document.getElementById('status').innerText = `Rendering ${pdfEntry.name}...`;
      const pdfData = await pdfEntry.async('arraybuffer');
      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      const page = await pdf.getPage(1);

      // High resolution scale for clear cropped text
      const viewport = page.getViewport({ scale: 2.5 });
      offscreenCanvas.height = viewport.height;
      offscreenCanvas.width = viewport.width;

      const context = offscreenCanvas.getContext('2d');
      await page.render({ canvasContext: context, viewport }).promise;

      fullImageBase64 = offscreenCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      document.getElementById('status').innerText = `Ready: ${pdfEntry.name}`;
    });

    // 2. Multimodal Extraction Returning Bounding Boxes
    document.getElementById('scanBtn').addEventListener('click', async () => {
      if (!API_KEY) {
        alert('API Key not found. Open console (F12) and run: localStorage.setItem("gemini_api_key", "YOUR_KEY")');
        return;
      }

      if (!fullImageBase64) {
        alert('Please select a zip file first.');
        return;
      }

      document.getElementById('status').innerText = 'Extracting specs & visual coordinates...';

      const prompt = `You are an expert PCB CAM engineer.
Analyze this PCB fabrication drawing and extract each required parameter with its exact visual 2D bounding box on the print.

Requirements:
- box_2d MUST be 4 normalized integers between 0 and 1000: [ymin, xmin, ymax, xmax] tightly surrounding the text note or table cell.
- If a spec is not found, set "value": "No data", "snippet": "No data", and "box_2d": null.

Return pure JSON matching this exact structure:
[
  { "category": "Stackup", "label": "Part Type / Layers", "value": "e.g. PCB - 2 Layer", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Material", "value": "e.g. FR4, UL94V-2", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Core & Pre-preg", "value": "e.g. 1 Core (59 mil FR-4)", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Copper Thickness", "value": "e.g. Outer: 1 oz (1.40 mil)", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness", "value": "e.g. 63 mil (1.59 mm)", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness Tol.", "value": "e.g. +/- 10%", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions", "label": "DIM-Unit", "value": "e.g. 1696.0 x 1840.0 mil", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions", "label": "Panel Profile", "value": "e.g. Routing", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Mask & Mark", "label": "Silkscreen Color", "value": "e.g. White", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Mask & Mark", "label": "Solder Mask Color", "value": "e.g. Solder Resist", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Hole Count", "value": "e.g. 106 Total", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Smallest Hole", "value": "e.g. 10.0 mil", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Compliance", "label": "IPC Class", "value": "e.g. IPC 6012 Class 2", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Compliance", "label": "RoHS Compliance", "value": "e.g. Compliant", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] }
]`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: 'image/jpeg', data: fullImageBase64 } }
              ]
            }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        specList = JSON.parse(data.candidates[0].content.parts[0].text);
        currentIndex = 0;
        document.getElementById('status').innerText = 'Extraction complete.';
        displayCurrentSpec();

      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'Error occurred.';
        alert(err.message);
      }
    });

    // 3. Render the Active Step
    function displayCurrentSpec() {
      if (!specList || specList.length === 0) return;

      const item = specList[currentIndex];
      const isNoData = item.value.toLowerCase().includes('no data');

      document.getElementById('stepCounter').innerText = `Spec ${currentIndex + 1} of ${specList.length}`;
      document.getElementById('specCategory').innerText = item.category || 'SPEC';
      document.getElementById('specLabel').innerText = item.label;
      document.getElementById('specValue').innerText = item.value;
      document.getElementById('specSnippet').innerText = item.snippet;

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === specList.length - 1);

      renderCroppedSnippet(item.box_2d);
    }

    // 4. Crop Canvas to the Target Coordinate Box
    function renderCroppedSnippet(box) {
      const placeholder = document.getElementById('snippetPlaceholder');
      const canvasWrapper = document.getElementById('canvasWrapper');

      if (!box || !Array.isArray(box) || box.length !== 4) {
        placeholder.innerText = 'No visual snippet callout located for this parameter.';
        placeholder.classList.remove('hidden');
        canvasWrapper.classList.add('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      canvasWrapper.classList.remove('hidden');

      const [ymin, xmin, ymax, xmax] = box;
      const imgW = offscreenCanvas.width;
      const imgH = offscreenCanvas.height;

      // Generous padding around the detected text for CAM context
      const padX = 60;
      const padY = 40;

      const sx = Math.max(0, (xmin / 1000) * imgW - padX);
      const sy = Math.max(0, (ymin / 1000) * imgH - padY);
      const sw = Math.min(imgW - sx, ((xmax - xmin) / 1000) * imgW + padX * 2);
      const sh = Math.min(imgH - sy, ((ymax - ymin) / 1000) * imgH + padY * 2);

      snippetCanvas.width = sw;
      snippetCanvas.height = sh;

      const ctx = snippetCanvas.getContext('2d');
      ctx.drawImage(offscreenCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

      // Draw highlighting rectangle around target callout
      const boxX = (xmin / 1000) * imgW - sx;
      const boxY = (ymin / 1000) * imgH - sy;
      const boxW = ((xmax - xmin) / 1000) * imgW;
      const boxH = ((ymax - ymin) / 1000) * imgH;

      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 4;
      ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeRect(boxX, boxY, boxW, boxH);
    }

    // 5. Button Listeners
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        displayCurrentSpec();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < specList.length - 1) {
        currentIndex++;
        displayCurrentSpec();
      }
    });
  </script>
</body>
</html>
