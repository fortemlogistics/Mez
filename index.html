<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Spec Inspector - Step-by-Step Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- Self-hosted fallback runner for PDF-to-canvas rasterization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
    <div class="flex items-center gap-4">
      <h1 class="text-base font-bold text-blue-400">PCB Spec Inspector</h1>
      <input type="file" id="fileInput" accept=".zip,.pdf" class="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-300 font-mono">Upload fabrication zip or pdf...</span>
    </div>
    
    <div>
      <button id="scanBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded text-xs font-semibold transition shadow-md shadow-blue-900/40">
        Run Extraction
      </button>
    </div>
  </header>

  <!-- Main Wizard Workspace -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Left: Dynamic Snippet Crop Viewer -->
    <section class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-950/80 border-r border-slate-800 relative overflow-auto">
      <div id="snippetPlaceholder" class="text-slate-500 text-sm italic">
        Upload a file and click "Run Extraction" to inspect specs.
      </div>
      
      <div id="canvasWrapper" class="hidden flex flex-col items-center max-w-full">
        <canvas id="snippetCanvas" class="shadow-2xl rounded-lg border border-slate-700 bg-white max-w-[95%] max-h-[75vh] object-contain"></canvas>
        <p class="text-[11px] text-slate-400 mt-3 font-mono italic">Cropped visual evidence from fabrication print</p>
      </div>

      <canvas id="offscreenCanvas" class="hidden"></canvas>
    </section>

    <!-- Right: Single Parameter Card -->
    <aside class="w-[440px] p-8 flex flex-col justify-between bg-slate-900">
      
      <div class="space-y-6">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <span id="stepCounter" class="text-xs font-mono uppercase tracking-wider text-slate-400">Spec 0 of 0</span>
          <span id="specCategory" class="text-[10px] uppercase font-bold tracking-widest px-2.5 py-1 rounded bg-blue-950 text-blue-300 border border-blue-800">--</span>
        </div>

        <div>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Parameter</span>
          <h2 id="specLabel" class="text-xl font-bold text-white mt-1">--</h2>
        </div>

        <div>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Suggested Value</span>
          <div id="specValue" class="text-xl font-mono text-emerald-400 font-semibold mt-2 p-4 bg-slate-950 rounded border border-slate-800 break-words leading-relaxed">
            --
          </div>
        </div>

        <div>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Verbatim Note Evidence</span>
          <div id="evidenceQuote" class="text-xs font-mono text-slate-300 italic mt-2 p-3 bg-slate-950/70 rounded border border-slate-800/80 break-words">
            --
          </div>
        </div>
      </div>

      <footer class="pt-6 border-t border-slate-800 flex items-center justify-between gap-4">
        <button id="prevBtn" disabled class="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 text-xs font-semibold rounded border border-slate-700 transition">
          ← Previous
        </button>
        <button id="nextBtn" disabled class="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 text-xs font-semibold rounded transition shadow-lg shadow-blue-900/30">
          Next →
        </button>
      </footer>

    </aside>
  </main>

  <script>
    let fullImageBase64 = null;
    let specList = [];
    let currentIndex = 0;

    const offscreenCanvas = document.getElementById('offscreenCanvas');
    const snippetCanvas = document.getElementById('snippetCanvas');
    const statusEl = document.getElementById('status');

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i += 8192) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, len)));
      }
      return window.btoa(binary);
    }

    // Render PDF Buffer to Offscreen Canvas for dynamic sub-region cropping
    async function renderPdfBuffer(pdfBuffer, displayName) {
      statusEl.innerText = `Rendering ${displayName}...`;
      
      const pdfEngine = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
      if (pdfEngine) {
        pdfEngine.GlobalWorkerOptions.workerSrc = false;
        const pdf = await pdfEngine.getDocument({ data: new Uint8Array(pdfBuffer), disableFontFace: true }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.5 });
        offscreenCanvas.height = viewport.height;
        offscreenCanvas.width = viewport.width;
        const context = offscreenCanvas.getContext('2d');
        await page.render({ canvasContext: context, viewport }).promise;
        fullImageBase64 = offscreenCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      } else {
        // Fallback: use raw PDF base64 if worker script is completely blocked
        fullImageBase64 = arrayBufferToBase64(pdfBuffer);
      }

      statusEl.innerText = `Ready: ${displayName}`;
    }

    function findPdfEntry(zipInstance) {
      const entries = Object.values(zipInstance.files).filter(f => !f.dir && !f.name.includes('__MACOSX'));
      return entries.find(f => {
        const n = f.name.toLowerCase().replace(/\\/g, '/');
        return n.endsWith('.pdf') && (n.includes('fab') || n.includes('dwg') || n.includes('drawing') || n.includes('print'));
      }) || entries.find(f => f.name.toLowerCase().endsWith('.pdf'));
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerText = `Reading ${file.name}...`;

      try {
        const arrayBuffer = await file.arrayBuffer();

        if (file.name.toLowerCase().endsWith('.pdf')) {
          await renderPdfBuffer(arrayBuffer, file.name);
          return;
        }

        const zip = await JSZip.loadAsync(arrayBuffer);
        let pdfEntry = findPdfEntry(zip);

        if (!pdfEntry) {
          const innerZips = Object.values(zip.files).filter(f => !f.dir && f.name.toLowerCase().endsWith('.zip'));
          for (const z of innerZips) {
            try {
              const innerBytes = await z.async('arraybuffer');
              const innerZip = await JSZip.loadAsync(innerBytes);
              pdfEntry = findPdfEntry(innerZip);
              if (pdfEntry) break;
            } catch (innerErr) {
              console.warn(innerErr);
            }
          }
        }

        if (!pdfEntry) {
          const names = Object.values(zip.files).filter(f => !f.dir && !f.name.includes('__MACOSX')).map(f => f.name.split('/').pop());
          alert(`No PDF drawing found inside "${file.name}".\n\nDetected files:\n` + names.slice(0, 10).join('\n'));
          return;
        }

        const cleanName = pdfEntry.name.split('/').pop().split('\\').pop();
        const pdfBytes = await pdfEntry.async('arraybuffer');
        await renderPdfBuffer(pdfBytes, cleanName);

      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Failed to load file.';
        alert(`Error opening "${file.name}":\n` + (err.message || err));
      }
    });

    document.getElementById('scanBtn').addEventListener('click', async () => {
      let apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        apiKey = prompt('Please enter your Gemini API Key:');
        if (!apiKey) return;
        localStorage.setItem('gemini_api_key', apiKey.trim());
      }

      if (!fullImageBase64) {
        alert('Please select a zip or pdf file first.');
        return;
      }

      statusEl.innerText = 'Extracting CAM specs & visual snippets...';

      const prompt = `You are an expert PCB CAM engineer performing strict drawing inspection.
Analyze this PCB fabrication drawing (FABRICATION NOTES, LAYER STACK TABLE, DRILL TABLE, and TITLE BLOCK).

CRITICAL INSTRUCTIONS:
1. For every parameter extracted, provide:
   - "value": The standardized CAM value.
   - "evidence_quote": The exact verbatim text or table entry copied directly from the drawing.
   - "box_2d": [ymin, xmin, ymax, xmax] normalized (scale 0-1000) tightly bounding the exact text or table row where this information was found.
2. ZERO-HALLUCINATION RULE:
   - If a specification (e.g. CTI, impedance, or specific tolerance) is NOT explicitly printed verbatim on the drawing, you MUST set "value": "NOT_SPECIFIED", "evidence_quote": "Not found in print", and "box_2d": null.
3. CONTROLLED VOCABULARY:
   - Surface Finish: Map "Tin/Lead" or "Sn/Pb" -> "HASL"; "Immersion Gold" -> "ENIG".
   - Solder Mask Class: Map "Class 2" -> "Class - T"; "Class 3" -> "Class - H".
   - Solder Mask Color: Must be an optical hue (e.g. Green, Black, White).

Return pure JSON array matching this exact template:
[
  { "category": "Stackup", "label": "Part Type", "value": "PCB - 2 Layer", "evidence_quote": "2 LAYER BOARD", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Material (1)", "value": "FR-4.0 170tg Undefined (EQV), IPC4101: 126, UL: V-0", "evidence_quote": "MATERIAL: FR4 TG 170", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Core & Pre-preg", "value": "# of Cores: 1   # of PP Sheets: 0", "evidence_quote": "CORE 0.059", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Cu Thickness", "value": "Inner: N/A   Outer: 1.000 (oz) Finish", "evidence_quote": "FINISHED COPPER 1 OZ", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness", "value": "0.062 (in) Finished Board", "evidence_quote": "OVERALL THICKNESS: .062 +/- 10%", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness Tol.", "value": "Yes 10%", "evidence_quote": "+/- 10%", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Imbalance Stackup", "value": "No", "evidence_quote": "SYMMETRICAL", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Bow & Twist Tol.", "value": "Yes 1%", "evidence_quote": "BOW AND TWIST SHALL NOT EXCEED 1.0%", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Surface Finish", "value": "ENIG", "evidence_quote": "FINISH: ENIG", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Gold Finger", "value": "No", "evidence_quote": "Not found in print", "box_2d": null },
  { "category": "Dimensions and Panel", "label": "DIM-Unit (in)", "value": "X - 1.696   Y - 1.840 (in)", "evidence_quote": "1.696 X 1.840", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Circuit Design", "label": "Min. Trace / Space", "value": "Trace - 6.000   Space - 6.000 (mil)", "evidence_quote": "MIN TRACE/SPACE .006", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "Silkscreen", "value": "White", "evidence_quote": "LEGEND: WHITE", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "Solder Mask Color", "value": "Black", "evidence_quote": "SOLDERMASK: BLACK", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Hole Count", "value": "106", "evidence_quote": "TOTAL HOLES: 106", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Smallest Hole", "value": "10.000 (mil)", "evidence_quote": "PLATED .010", "box_2d": [ymin, xmin, ymax, xmax] }
]`;

      try {
        const mime = offscreenCanvas.width > 0 ? 'image/jpeg' : 'application/pdf';
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: mime, data: fullImageBase64 } }
              ]
            }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        let rawText = data.candidates[0].content.parts[0].text.trim();
        if (rawText.startsWith('```')) {
          rawText = rawText.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '');
        }

        specList = JSON.parse(rawText);
        currentIndex = 0;
        statusEl.innerText = 'Extraction complete.';
        displayCurrentSpec();

      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Error occurred.';
        alert(err.message);
      }
    });

    function displayCurrentSpec() {
      if (!specList || specList.length === 0) return;

      const item = specList[currentIndex];

      document.getElementById('stepCounter').innerText = `Spec ${currentIndex + 1} of ${specList.length}`;
      document.getElementById('specCategory').innerText = item.category || 'SPEC';
      document.getElementById('specLabel').innerText = item.label;
      document.getElementById('specValue').innerText = (item.value === "NOT_SPECIFIED" ? "Not Specified" : item.value);
      document.getElementById('evidenceQuote').innerText = item.evidence_quote || "No verbatim text cited";

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === specList.length - 1);

      renderCroppedSnippet(item.box_2d);
    }

    // Dynamic Slicing & Zooming into the Target Visual Callout
    function renderCroppedSnippet(box) {
      const placeholder = document.getElementById('snippetPlaceholder');
      const canvasWrapper = document.getElementById('canvasWrapper');

      if (!box || !Array.isArray(box) || box.length !== 4 || offscreenCanvas.width === 0) {
        placeholder.innerText = 'No visual snippet callout located on print for this parameter.';
        placeholder.classList.remove('hidden');
        canvasWrapper.classList.add('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      canvasWrapper.classList.remove('hidden');

      const [ymin, xmin, ymax, xmax] = box;
      const imgW = offscreenCanvas.width;
      const imgH = offscreenCanvas.height;

      // 80px horizontal and 40px vertical contextual padding
      const padX = 80;
      const padY = 40;

      const sx = Math.max(0, (xmin / 1000) * imgW - padX);
      const sy = Math.max(0, (ymin / 1000) * imgH - padY);
      const sw = Math.min(imgW - sx, ((xmax - xmin) / 1000) * imgW + padX * 2);
      const sh = Math.min(imgH - sy, ((ymax - ymin) / 1000) * imgH + padY * 2);

      snippetCanvas.width = sw;
      snippetCanvas.height = sh;

      const ctx = snippetCanvas.getContext('2d');
      // Render the cropped region cleanly
      ctx.drawImage(offscreenCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        displayCurrentSpec();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < specList.length - 1) {
        currentIndex++;
        displayCurrentSpec();
      }
    });
  </script>
</body>
</html>
