<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Spec Inspector - Step-by-Step Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
    <div class="flex items-center gap-4">
      <h1 class="text-base font-bold text-blue-400">PCB Spec Inspector</h1>
      <input type="file" id="zipInput" accept=".zip" class="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-300 font-mono">Upload fabrication zip...</span>
    </div>
    
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <label for="apiKeyInput" class="text-xs text-slate-400">API Key:</label>
        <input 
          type="password" 
          id="apiKeyInput" 
          placeholder="AI Studio Key (AQ...)" 
          class="bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-blue-500 w-52"
        />
      </div>
      <button id="scanBtn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-semibold transition shadow-md shadow-blue-900/40">
        Run Extraction
      </button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    
    <section class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-950/80 border-r border-slate-800 relative overflow-auto">
      <div id="snippetPlaceholder" class="text-slate-500 text-sm italic">
        Upload a zip file and click "Run Extraction" to inspect specs.
      </div>
      
      <div id="canvasWrapper" class="hidden flex flex-col items-center max-w-full">
        <canvas id="snippetCanvas" class="shadow-2xl rounded-lg border border-slate-700 bg-white max-w-[95%] h-auto object-contain"></canvas>
        <p class="text-[11px] text-slate-400 mt-2 italic">Cropped direct from fabrication print</p>
      </div>

      <canvas id="offscreenCanvas" class="hidden"></canvas>
    </section>

    <aside class="w-[440px] p-8 flex flex-col justify-between bg-slate-900">
      
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-6">
          <span id="stepCounter" class="text-xs font-mono uppercase tracking-wider text-slate-400">Spec 0 of 0</span>
          <span id="specCategory" class="text-[10px] uppercase font-bold tracking-widest px-2.5 py-1 rounded bg-blue-950 text-blue-300 border border-blue-800">--</span>
        </div>

        <div class="space-y-6">
          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Parameter</span>
            <h2 id="specLabel" class="text-xl font-bold text-white mt-1">--</h2>
          </div>

          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Suggested Value</span>
            <div id="specValue" class="text-xl font-mono text-emerald-400 font-semibold mt-2 p-4 bg-slate-950 rounded border border-slate-800 break-words leading-relaxed">
              --
            </div>
          </div>
        </div>
      </div>

      <footer class="pt-6 border-t border-slate-800 flex items-center justify-between gap-4">
        <button id="prevBtn" disabled class="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 text-xs font-semibold rounded border border-slate-700 transition">
          ← Previous
        </button>
        <button id="nextBtn" disabled class="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 text-xs font-semibold rounded transition shadow-lg shadow-blue-900/30">
          Next →
        </button>
      </footer>

    </aside>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let fullImageBase64 = null;
    let specList = [];
    let currentIndex = 0;

    const offscreenCanvas = document.getElementById('offscreenCanvas');
    const snippetCanvas = document.getElementById('snippetCanvas');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const statusEl = document.getElementById('status');

    // Auto-load API Key from localStorage
    const storedKey = localStorage.getItem('gemini_api_key') || "";
    if (storedKey) {
      apiKeyInput.value = storedKey;
    }

    // Auto-save API Key when entered
    apiKeyInput.addEventListener('input', (e) => {
      localStorage.setItem('gemini_api_key', e.target.value.trim());
    });

    // 1. Unpack Zip with Deep PDF Discovery
    document.getElementById('zipInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerText = `Reading ${file.name}...`;

      try {
        const arrayBuffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);

        const fileEntries = Object.values(zip.files).filter(f => !f.dir && !f.name.includes('__MACOSX'));
        console.log('Zip files:', fileEntries.map(f => f.name));

        // Locate any pdf file
        let pdfFile = fileEntries.find(f => {
          const n = f.name.toLowerCase();
          return n.endsWith('.pdf') && (n.includes('fab') || n.includes('dwg') || n.includes('drawing') || n.includes('print'));
        }) || fileEntries.find(f => f.name.toLowerCase().endsWith('.pdf'));

        if (!pdfFile) {
          const names = fileEntries.map(f => f.name.split('/').pop()).slice(0, 8).join(', ');
          statusEl.innerText = 'No PDF found in zip.';
          alert(`No PDF drawing found inside "${file.name}".\n\nFound files:\n${names}`);
          return;
        }

        const cleanName = pdfFile.name.split('/').pop();
        statusEl.innerText = `Rendering ${cleanName}...`;

        const pdfBytes = await pdfFile.async('arraybuffer');
        const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
        const page = await pdf.getPage(1);

        const viewport = page.getViewport({ scale: 2.5 });
        offscreenCanvas.height = viewport.height;
        offscreenCanvas.width = viewport.width;

        const context = offscreenCanvas.getContext('2d');
        await page.render({ canvasContext: context, viewport }).promise;

        fullImageBase64 = offscreenCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
        statusEl.innerText = `Ready: ${cleanName}`;
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Zip load error.';
        alert(`Failed to extract "${file.name}": ` + err.message);
      }
    });

    // 2. Multimodal Extraction
    document.getElementById('scanBtn').addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert('Please paste your Gemini API Key in the top header.');
        apiKeyInput.focus();
        return;
      }
      localStorage.setItem('gemini_api_key', apiKey);

      if (!fullImageBase64) {
        alert('Please select a zip file first.');
        return;
      }

      statusEl.innerText = 'Extracting specs...';

      const prompt = `You are an expert PCB CAM engineer.
Analyze this PCB fabrication drawing (FABRICATION NOTES, LAYER STACK TABLE, DRILL TABLE, and TITLE BLOCK).
Extract the required parameters matching this exact list.
For every parameter, provide its normalized bounding box [ymin, xmin, ymax, xmax] (scale 0-1000) pointing to where the evidence was located. If not stated, set "box_2d": null and "value": "No" or "No data".

Format Rules:
- "Core & Pre-preg": Format as "# of Cores: <X>   # of PP Sheets: <Y>"
- "Cu Thickness": Format as "Inner: <val>   Outer: <val> Finish"
- "Board Thickness": Format as "<in> Finished Board" or equivalent
- "Board Thickness Tol.": Format as "Yes <tolerance>%" or "No data"
- "Bow & Twist Tol.": Format as "Yes <tolerance>%" or "No data"
- "Surface Finish": Format as "<Type> (e.g. ENIG, HASL Lead-Free)"
- "DIM-Unit (in)": Format as "X - <val>   Y - <val>"
- "Solder Mask Color": Must be optical color (e.g. Green, Black, White). Never use "Solder Resist".
- "Hole Count": Total number of holes from drill chart
- "Smallest Hole": Smallest finished drill diameter

Return pure JSON array matching this exact template:
[
  { "category": "Stackup", "label": "Part Type", "value": "PCB - 2 Layer", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Material (1)", "value": "FR-4.0 170tg Undefined (EQV), IPC4101: 126, UL: V-0", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Core & Pre-preg", "value": "# of Cores: 1   # of PP Sheets: 0", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Cu Thickness", "value": "Inner: N/A   Outer: 1.000 (oz) Finish", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness", "value": "0.062 (in) Finished Board", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness Tol.", "value": "Yes 10%", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Imbalance Stackup", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Bow & Twist Tol.", "value": "Yes 1%", "box_2d": [ymin, xmin, ymax, xmax] },
  
  { "category": "Finishing", "label": "Surface Finish", "value": "ENIG", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Gold Finger", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Edge Plating", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Half-plated Holes", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Dimensions and Panel", "label": "DIM-Unit (in)", "value": "X - 1.696   Y - 1.840 (in)", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions and Panel", "label": "Panelized", "value": "Single Unit", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions and Panel", "label": "Multipanel", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions and Panel", "label": "Panel Profile", "value": "Routing", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions and Panel", "label": "Beveling", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Dimensions and Panel", "label": "X-Out Allow (Yes)", "value": "No data", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Circuit Design", "label": "Min. Trace / Space", "value": "Trace - 6.000   Space - 6.000 (mil)", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Circuit Design", "label": "Impedance Ctrl", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Circuit Design", "label": "BGA Design", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Solder Mask and Marking", "label": "Silkscreen", "value": "White", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "Solder Mask Color", "value": "Black / Non-Specific", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "Solder Mask Finish", "value": "Non-Specific", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "Solder Mask Class", "value": "Class - T", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "Temp. Mask", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Solder Mask and Marking", "label": "E-Test Mark", "value": "Yes Location U/D", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Holes", "label": "Hole Count", "value": "106", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Smallest Hole", "value": "10.000 (mil)", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "TH Plugging", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Blind Vias", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Buried Vias", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Holes", "label": "Slots", "value": "PTH", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Compliance and Reporting", "label": "ITAR Regulated", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Compliance and Reporting", "label": "IPC Class", "value": "Class II", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Compliance and Reporting", "label": "RoHS", "value": "RoHS 3", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Compliance and Reporting", "label": "REACH", "value": "Yes", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Compliance and Reporting", "label": "UL Required", "value": "Yes Logo: Yes", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Packaging", "label": "Packaging Type", "value": "Bubble Wrap / Standard", "box_2d": [ymin, xmin, ymax, xmax] }
]`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: 'image/jpeg', data: fullImageBase64 } }
              ]
            }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        specList = JSON.parse(data.candidates[0].content.parts[0].text);
        currentIndex = 0;
        statusEl.innerText = 'Extraction complete.';
        displayCurrentSpec();

      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Error occurred.';
        alert(err.message);
      }
    });

    // 3. Step Controller
    function displayCurrentSpec() {
      if (!specList || specList.length === 0) return;

      const item = specList[currentIndex];

      document.getElementById('stepCounter').innerText = `Spec ${currentIndex + 1} of ${specList.length}`;
      document.getElementById('specCategory').innerText = item.category || 'SPEC';
      document.getElementById('specLabel').innerText = item.label;
      document.getElementById('specValue').innerText = item.value;

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === specList.length - 1);

      renderCroppedSnippet(item.box_2d);
    }

    // 4. Crop Canvas Cleanly
    function renderCroppedSnippet(box) {
      const placeholder = document.getElementById('snippetPlaceholder');
      const canvasWrapper = document.getElementById('canvasWrapper');

      if (!box || !Array.isArray(box) || box.length !== 4) {
        placeholder.innerText = 'No visual snippet callout located for this parameter.';
        placeholder.classList.remove('hidden');
        canvasWrapper.classList.add('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      canvasWrapper.classList.remove('hidden');

      const [ymin, xmin, ymax, xmax] = box;
      const imgW = offscreenCanvas.width;
      const imgH = offscreenCanvas.height;

      const padX = 140;
      const padY = 50;

      const sx = Math.max(0, (xmin / 1000) * imgW - padX);
      const sy = Math.max(0, (ymin / 1000) * imgH - padY);
      const sw = Math.min(imgW - sx, ((xmax - xmin) / 1000) * imgW + padX * 2);
      const sh = Math.min(imgH - sy, ((ymax - ymin) / 1000) * imgH + padY * 2);

      snippetCanvas.width = sw;
      snippetCanvas.height = sh;

      const ctx = snippetCanvas.getContext('2d');
      ctx.drawImage(offscreenCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
    }

    // 5. Navigation Listeners
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        displayCurrentSpec();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < specList.length - 1) {
        currentIndex++;
        displayCurrentSpec();
      }
    });
  </script>
</body>
</html>
