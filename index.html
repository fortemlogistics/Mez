<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Spec Inspector - Step-by-Step Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
    <div class="flex items-center gap-4">
      <h1 class="text-base font-bold text-blue-400">PCB Spec Inspector</h1>
      <input type="file" id="zipInput" accept=".zip" class="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-400">Upload fabrication zip...</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="scanBtn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-semibold transition shadow-md shadow-blue-900/40">
        Run Extraction
      </button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    
    <section class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-950/80 border-r border-slate-800 relative overflow-auto">
      <div id="snippetPlaceholder" class="text-slate-500 text-sm italic">
        Upload a zip file and click "Run Extraction" to inspect specs.
      </div>
      
      <div id="canvasWrapper" class="hidden flex flex-col items-center max-w-full">
        <canvas id="snippetCanvas" class="shadow-2xl rounded-lg border border-slate-700 bg-white max-w-[95%] h-auto object-contain"></canvas>
        <p class="text-[11px] text-slate-400 mt-2 italic">Cropped direct from fabrication print</p>
      </div>

      <canvas id="offscreenCanvas" class="hidden"></canvas>
    </section>

    <aside class="w-[440px] p-8 flex flex-col justify-between bg-slate-900">
      
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-6">
          <span id="stepCounter" class="text-xs font-mono uppercase tracking-wider text-slate-400">Spec 0 of 0</span>
          <span id="specCategory" class="text-[10px] uppercase font-bold tracking-widest px-2.5 py-1 rounded bg-blue-950 text-blue-300 border border-blue-800">--</span>
        </div>

        <div class="space-y-6">
          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Parameter</span>
            <h2 id="specLabel" class="text-xl font-bold text-white mt-1">--</h2>
          </div>

          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Suggested Value</span>
            <div id="specValue" class="text-xl font-mono text-emerald-400 font-semibold mt-2 p-4 bg-slate-950 rounded border border-slate-800 break-words leading-relaxed">
              --
            </div>
          </div>
        </div>
      </div>

      <footer class="pt-6 border-t border-slate-800 flex items-center justify-between gap-4">
        <button id="prevBtn" disabled class="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 text-xs font-semibold rounded border border-slate-700 transition">
          ← Previous
        </button>
        <button id="nextBtn" disabled class="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 text-xs font-semibold rounded transition shadow-lg shadow-blue-900/30">
          Next →
        </button>
      </footer>

    </aside>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let fullImageBase64 = null;
    let specList = [];
    let currentIndex = 0;

    const offscreenCanvas = document.getElementById('offscreenCanvas');
    const snippetCanvas = document.getElementById('snippetCanvas');
    const API_KEY = localStorage.getItem('gemini_api_key') || "";

    // 1. Recursive Zip Unpacker & Resilient PDF Detection
    document.getElementById('zipInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const status = document.getElementById('status');
      if (!file) return;

      status.innerText = 'Unpacking zip...';

      try {
        const zip = await JSZip.loadAsync(file);
        const entries = Object.values(zip.files).filter(f => !f.dir && !f.name.startsWith('__MACOSX'));

        console.log('Zip contents:', entries.map(f => f.name));

        // Prioritize drawings and fabrication prints
        let targetPdf = entries.find(f => {
          const name = f.name.toLowerCase();
          return name.endsWith('.pdf') && (name.includes('fab') || name.includes('dwg') || name.includes('drawing'));
        });

        // Fallback to any valid PDF in the archive
        if (!targetPdf) {
          targetPdf = entries.find(f => f.name.toLowerCase().endsWith('.pdf'));
        }

        if (!targetPdf) {
          const extensions = [...new Set(entries.map(f => f.name.split('.').pop()))].join(', ');
          status.innerText = `No PDF inside. Found files: .${extensions}`;
          alert(`No PDF drawing found inside "${file.name}".\n\nDetected files:\n` + entries.map(f => f.name).slice(0, 10).join('\n'));
          return;
        }

        const fileNameOnly = targetPdf.name.split('/').pop();
        status.innerText = `Rendering ${fileNameOnly}...`;

        const pdfData = await targetPdf.async('arraybuffer');
        const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
        const page = await pdf.getPage(1);

        const viewport = page.getViewport({ scale: 2.5 });
        offscreenCanvas.height = viewport.height;
        offscreenCanvas.width = viewport.width;

        const context = offscreenCanvas.getContext('2d');
        await page.render({ canvasContext: context, viewport }).promise;

        fullImageBase64 = offscreenCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
        status.innerText = `Ready: ${fileNameOnly}`;
      } catch (err) {
        console.error(err);
        status.innerText = 'Failed to load archive.';
        alert('Error parsing zip file: ' + err.message);
      }
    });

    // 2. Multimodal Extraction Across All Spec Domains
    document.getElementById('scanBtn').addEventListener('click', async () => {
      if (!API_KEY) {
        alert('API Key not found. Open Console (F12) and run: localStorage.setItem("gemini_api_key", "YOUR_KEY")');
        return;
      }

      if (!fullImageBase64) {
        alert('Please select a zip file first.');
        return;
      }

      document.getElementById('status').innerText = 'Extracting all CAM specifications...';

      const prompt = `You are an expert PCB CAM engineer.
Examine this PCB fabrication print (FABRICATION NOTES, LAYER STACK TABLE, DRILL TABLE, and TITLE BLOCK).
Extract the required parameters matching this exact list.
For every parameter, provide its normalized bounding box [ymin, xmin, ymax, xmax] (scale 0-1000) pointing to where the evidence was located. If not stated, set "box_2d": null and "value": "No" or "No data".

Format Rules:
- "Core & Pre-preg": Format as "# of Cores: <X>   # of PP Sheets: <Y>"
- "Cu Thickness": Format as "Inner: <val>   Outer: <val> Finish"
- "Board Thickness": Format as "<in> Finished Board" or equivalent
- "Board Thickness Tol.": Format as "Yes <tolerance>%" or "No data"
- "Bow & Twist Tol.": Format as "Yes <tolerance>%" or "No data"
- "Surface Finish": Format as "<Type> (e.g. ENIG, HASL Lead-Free)"
- "DIM-Unit (in)": Format as "X - <val>   Y - <val>"
- "Solder Mask Color": Must be optical color (e.g. Green, Black, White). Never use "Solder Resist".
- "Hole Count": Total number of holes from drill chart
- "Smallest Hole": Smallest finished drill diameter

Return pure JSON array matching this exact template:
[
  { "category": "Stackup", "label": "Part Type", "value": "PCB - 2 Layer", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Material (1)", "value": "FR-4.0 170tg Undefined (EQV), IPC4101: 126, UL: V-0", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Core & Pre-preg", "value": "# of Cores: 1   # of PP Sheets: 0", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Cu Thickness", "value": "Inner: N/A   Outer: 1.000 (oz) Finish", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness", "value": "0.062 (in) Finished Board", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Board Thickness Tol.", "value": "Yes 10%", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Imbalance Stackup", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Bow & Twist Tol.", "value": "Yes 1%", "box_2d": [ymin, xmin, ymax, xmax] },
  
  { "category": "Finishing", "label": "Surface Finish", "value": "ENIG", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Gold Finger", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Edge Plating", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Finishing", "label": "Half-plated Holes", "value": "No", "box_2d": [ymin, xmin, ymax, xmax] },

  { "category": "Dimensions and Panel", "label": "DIM-Unit (in)", "value": "X - 1.696   Y - 1.840 (in
