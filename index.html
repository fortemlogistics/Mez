<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Spec Inspector - Step-by-Step Snippet Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
    <div class="flex items-center gap-4">
      <h1 class="text-base font-bold text-blue-400">PCB Spec Inspector</h1>
      <input type="file" id="zipInput" accept=".zip" class="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-400">Upload fabrication zip...</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="scanBtn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-semibold transition shadow-md shadow-blue-900/40">
        Run Extraction
      </button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden">
    
    <section class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-950/80 border-r border-slate-800 relative overflow-auto">
      <div id="snippetPlaceholder" class="text-slate-500 text-sm italic">
        Upload a zip file and click "Run Extraction" to generate snippets.
      </div>
      
      <div id="canvasWrapper" class="hidden flex flex-col items-center max-w-full">
        <canvas id="snippetCanvas" class="shadow-2xl rounded-lg border-2 border-slate-700 bg-white max-w-[95%] h-auto object-contain"></canvas>
        <p class="text-[11px] text-slate-400 mt-2 italic">Cropped direct from fabrication drawing</p>
      </div>

      <canvas id="offscreenCanvas" class="hidden"></canvas>
    </section>

    <aside class="w-[440px] p-8 flex flex-col justify-between bg-slate-900">
      
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-6">
          <span id="stepCounter" class="text-xs font-mono uppercase tracking-wider text-slate-400">Spec 0 of 0</span>
          <span id="specCategory" class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">--</span>
        </div>

        <div class="space-y-5">
          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Parameter</span>
            <h2 id="specLabel" class="text-lg font-bold text-white mt-0.5">--</h2>
          </div>

          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Suggested Value</span>
            <div id="specValue" class="text-xl font-mono text-emerald-400 font-semibold mt-1 p-3 bg-slate-950 rounded border border-slate-800">
              --
            </div>
          </div>

          <div>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Verbatim Reference Quote</span>
            <blockquote id="specSnippet" class="mt-1 p-3 bg-slate-950 border-l-2 border-emerald-400 text-xs italic text-slate-300 rounded-r break-words">
              No scan performed yet.
            </blockquote>
          </div>
        </div>
      </div>

      <footer class="pt-6 border-t border-slate-800 flex items-center justify-between gap-4">
        <button id="prevBtn" disabled class="flex-1 py-2 px-4 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 text-xs font-semibold rounded border border-slate-700 transition">
          ← Previous
        </button>
        <button id="nextBtn" disabled class="flex-1 py-2 px-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:hover:bg-blue-600 text-xs font-semibold rounded transition shadow-lg shadow-blue-900/30">
          Next →
        </button>
      </footer>

    </aside>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let fullImageBase64 = null;
    let specList = [];
    let currentIndex = 0;

    const offscreenCanvas = document.getElementById('offscreenCanvas');
    const snippetCanvas = document.getElementById('snippetCanvas');
    const API_KEY = localStorage.getItem('gemini_api_key') || "";

    // 1. Unpack Zip and Render Full PDF Page to Offscreen Canvas
    document.getElementById('zipInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('status').innerText = 'Unpacking zip...';
      const zip = await JSZip.loadAsync(file);

      const pdfEntry = Object.values(zip.files).find(f => 
        f.name.toLowerCase().endsWith('.pdf') && 
        (f.name.toLowerCase().includes('fab') || f.name.toLowerCase().includes('drawing') || f.name.toLowerCase().includes('dwg'))
      ) || Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.pdf'));

      if (!pdfEntry) {
        document.getElementById('status').innerText = 'No PDF found in zip.';
        return;
      }

      document.getElementById('status').innerText = `Rendering ${pdfEntry.name}...`;
      const pdfData = await pdfEntry.async('arraybuffer');
      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      const page = await pdf.getPage(1);

      const viewport = page.getViewport({ scale: 2.5 });
      offscreenCanvas.height = viewport.height;
      offscreenCanvas.width = viewport.width;

      const context = offscreenCanvas.getContext('2d');
      await page.render({ canvasContext: context, viewport }).promise;

      fullImageBase64 = offscreenCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      document.getElementById('status').innerText = `Ready: ${pdfEntry.name}`;
    });

    // 2. Multimodal Extraction Returning Accurate Coordinates for Cropping
    document.getElementById('scanBtn').addEventListener('click', async () => {
      if (!API_KEY) {
        alert('API Key not found. Open console (F12) and run: localStorage.setItem("gemini_api_key", "YOUR_KEY")');
        return;
      }

      if (!fullImageBase64) {
        alert('Please select a zip file first.');
        return;
      }

      document.getElementById('status').innerText = 'Extracting specs & visual coordinates...';

      const prompt = `You are an expert PCB CAM engineer.
Analyze this PCB fabrication drawing (FABRICATION NOTES, LAYER STACK TABLE, DRILL TABLE, and title block).
Extract each parameter and return its visual 2D bounding box on the drawing.

CRITICAL RULES:
1. "Solder Mask Color": Must be an actual optical color (e.g., Green, Black, White, Blue, Red, Matte Black).
   - "Solder Resist" is a material, not a color. If only "Solder Resist" is written with no pigment named, return "Non-Specific (EQV)" or "No data".
2. "Core & Pre-preg": Count laminate cores vs prepregs. For 2-layer rigid: "# of Cores: 1   # of PP Sheets: 0".
3. "box_2d": An array of 4 normalized integers between 0 and 1000: [ymin, xmin, ymax, xmax] tightly surrounding the target note text or table line.
   - If a spec is not found, set "value": "No data", "snippet": "No data", and "box_2d": null.

Return pure JSON matching this exact structure:
[
  { "category": "Stackup", "label": "Part Type / Layers", "value": "e.g. PCB - 2 Layer, Rigid", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Material", "value": "e.g. FR4, UL94V-2", "snippet": "...", "box_2d": [ymin, xmin, ymax, xmax] },
  { "category": "Stackup", "label": "Core & Pre-preg", "value": "# of Cores: 1   # of PP Sheets: 0", "snippet": "...", "box_2d":
