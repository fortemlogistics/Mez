<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Multi-Spec Inspector Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex h-screen overflow-hidden font-sans">

  <!-- Left: PDF Drawing Viewer -->
  <div class="flex-1 flex flex-col border-r border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
      <input type="file" id="zipInput" accept=".zip" class="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-400">Upload a PCB fabrication zip...</span>
    </div>
    <div id="viewer" class="flex-1 overflow-auto p-4 flex justify-center bg-slate-900">
      <canvas id="pdfCanvas" class="shadow-2xl max-w-full h-auto rounded border border-slate-700"></canvas>
    </div>
  </div>

  <!-- Right: Categorized Specs Inspector Panel -->
  <div class="w-[520px] p-6 flex flex-col bg-slate-950 overflow-y-auto">
    <h2 class="text-lg font-bold mb-4 text-blue-400">PCB Spec Inspector</h2>

    <button id="scanBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded font-medium text-sm transition shadow-lg shadow-blue-900/30">
      Extract All PCB Specs
    </button>

    <div id="specsContainer" class="mt-6 border-t border-slate-800 pt-4 space-y-6">
      <div class="text-xs text-slate-500 italic">Upload a zip and click extract to scan specifications.</div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let targetImageBase64 = null;

    const API_KEY = localStorage.getItem('gemini_api_key') || "";

    // 1. Unpack Zip & Render PDF Page 1
    document.getElementById('zipInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('status').innerText = 'Unpacking zip...';
      const zip = await JSZip.loadAsync(file);

      const pdfEntry = Object.values(zip.files).find(f => 
        f.name.toLowerCase().endsWith('.pdf') && 
        (f.name.toLowerCase().includes('fab') || f.name.toLowerCase().includes('drawing') || f.name.toLowerCase().includes('dwg'))
      ) || Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.pdf'));

      if (!pdfEntry) {
        document.getElementById('status').innerText = 'No PDF found in zip.';
        return;
      }

      document.getElementById('status').innerText = `Rendering ${pdfEntry.name}...`;
      const pdfData = await pdfEntry.async('arraybuffer');
      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      const page = await pdf.getPage(1);

      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport }).promise;
      targetImageBase64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      document.getElementById('status').innerText = `Loaded: ${pdfEntry.name}`;
    });

    // 2. Multimodal LLM Extraction Across All Spec Domains
    document.getElementById('scanBtn').addEventListener('click', async () => {
      if (!API_KEY) {
        alert('API Key not found. Open Console (F12) and run: localStorage.setItem("gemini_api_key", "YOUR_KEY")');
        return;
      }

      if (!targetImageBase64) {
        alert('Please upload a zip containing a PDF drawing first.');
        return;
      }

      const container = document.getElementById('specsContainer');
      container.innerHTML = '<div class="text-sm text-blue-400 animate-pulse">Analyzing notes, layer stackup table, dimensions, and drill chart...</div>';

      const prompt = `You are an expert PCB manufacturing CAM engineer.
Examine this PCB fabrication print (all notes, drill tables, layer stackup tables, dimensions, and title blocks).
Extract all parameters into JSON. If a spec is not stated or cannot be determined, set "value" to "No data" and "snippet" to "No data".
snippets MUST be exact verbatim quotes from the print.

Output pure JSON matching this exact structure:
{
  "stackup_material": {
    "part_type": { "value": "e.g. PCB - 2 Layer", "snippet": "..." },
    "material": { "value": "e.g. FR4, UL94V-2", "snippet": "..." },
    "core_prepreg": { "value": "e.g. # Cores: 1, # PP Sheets: 0", "snippet": "..." },
    "copper_thickness": { "value": "e.g. Outer: 1 oz (1.40 mil), Inner: N/A", "snippet": "..." },
    "board_thickness": { "value": "e.g. 63 mil (1.59 mm)", "snippet": "..." },
    "board_thickness_tol": { "value": "e.g. +/- 10%", "snippet": "..." },
    "imbalance_stackup": { "value": "Yes or No", "snippet": "..." },
    "bow_twist_tol": { "value": "e.g. 1% or No data", "snippet": "..." }
  },
  "dimensions_panel": {
    "dim_unit": { "value": "e.g. X - 1477.0 mil, Y - 1848.0 mil", "snippet": "..." },
    "panelized": { "value": "e.g. Single Unit or No data", "snippet": "..." },
    "dim_panel": { "value": "e.g. No data", "snippet": "..." },
    "rails": { "value": "e.g. No data", "snippet": "..." },
    "multipanel": { "value": "No", "snippet": "..." },
    "panel_profile": { "value": "e.g. Routing or No data", "snippet": "..." },
    "beveling": { "value": "e.g. 30 degrees or No", "snippet": "..." },
    "x_out_allow": { "value": "e.g. No data", "snippet": "..." }
  },
  "soldermask_marking": {
    "silkscreen": { "value": "e.g. White", "snippet": "..." },
    "soldermask_color": { "value": "e.g. Solder Resist / Non-Specific", "snippet": "..." },
    "soldermask_finish": { "value": "e.g. Non-Specific", "snippet": "..." },
    "soldermask_class": { "value": "e.g. Class - T or No data", "snippet": "..." },
    "soldermask_thck": { "value": "e.g. 0.4 mil", "snippet": "..." },
    "temp_mask": { "value": "No", "snippet": "..." },
    "e_test_mark": { "value": "e.g. Test continuity to all solderable pads", "snippet": "..." },
    "two_d_code": { "value": "No", "snippet": "..." },
    "date_code_format": { "value": "e.g. No data", "snippet": "..." }
  },
  "holes": {
    "hole_count": { "value": "e.g. 106 Total", "snippet": "..." },
    "smallest_hole": { "value": "e.g. 10.0 mil (0.25 mm)", "snippet": "..." },
    "hole_wall_cu": { "value": "e.g. No data", "snippet": "..." },
    "th_plugging": { "value": "No", "snippet": "..." },
    "blind_buried_vias": { "value": "None", "snippet": "..." },
    "slots": { "value": "None or No data", "snippet": "..." },
    "backdrill": { "value": "No", "snippet": "..." },
    "countersink": { "value": "No", "snippet": "..." },
    "pressfit_holes": { "value": "No", "snippet": "..." }
  },
  "compliance_reporting": {
    "ipc_class": { "value": "e.g. IPC 6012 Class 2", "snippet": "..." },
    "rohs": { "value": "e.g. Compliant (Lead-free)", "snippet": "..." },
    "reach": { "value": "e.g. Compliant", "snippet": "..." },
    "halogen_free": { "value": "No data", "snippet": "..." },
    "ul_required": { "value": "e.g. UL94V-2", "snippet": "..." },
    "fai_ppap": { "value": "No data", "snippet": "..." },
    "ionic_contamination": { "value": "No data", "snippet": "..." }
  }
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: 'image/jpeg', data: targetImageBase64 } }
              ]
            }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        });

        const data = await response.json();

        if (data.error) throw new Error(`Google API: ${data.error.message || JSON.stringify(data.error)}`);
        if (!data.candidates || !data.candidates[0].content) throw new Error('Empty response from model.');

        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        renderCategorizedSpecs(parsed);

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="p-3 bg-red-950 border border-red-700 text-red-300 text-xs rounded">${err.message}</div>`;
      }
    });

    function renderCategorizedSpecs(data) {
      const sectionConfigs = [
        {
          title: "Stackup & Material",
          data: data.stackup_material,
          labels: {
            part_type: "Part Type",
            material: "Material",
            core_prepreg: "Core & Pre-preg",
            copper_thickness: "Cu Thickness",
            board_thickness: "Board Thickness",
            board_thickness_tol: "Board Thickness Tol.",
            imbalance_stackup: "Imbalance Stackup",
            bow_twist_tol: "Bow & Twist Tol."
          }
        },
        {
          title: "Dimensions and Panel",
          data: data.dimensions_panel,
          labels: {
            dim_unit: "DIM-Unit",
            panelized: "Panelized",
            dim_panel: "DIM-Panel",
            rails: "Rails",
            multipanel: "Multipanel",
            panel_profile: "Panel Profile",
            beveling: "Beveling",
            x_out_allow: "X-Out Allow"
          }
        },
        {
          title: "Solder Mask and Marking",
          data: data.soldermask_marking,
          labels: {
            silkscreen: "Silkscreen",
            soldermask_color: "Solder Mask Color",
            soldermask_finish: "Solder Mask Finish",
            soldermask_class: "Solder Mask Class",
            soldermask_thck: "Solder Mask Thck",
            temp_mask: "Temp. Mask",
            e_test_mark: "E-Test Mark",
            two_d_code: "2D Code",
            date_code_format: "Date Code Format"
          }
        },
        {
          title: "Holes",
          data: data.holes,
          labels: {
            hole_count: "Hole Count",
            smallest_hole: "Smallest Hole",
            hole_wall_cu: "Hole Wall Cu",
            th_plugging: "TH Plugging",
            blind_buried_vias: "Blind / Buried Vias",
            slots: "Slots",
            backdrill: "Backdrill",
            countersink: "Countersink",
            pressfit_holes: "Pressfit Holes"
          }
        },
        {
          title: "Compliance and Reporting",
          data: data.compliance_reporting,
          labels: {
            ipc_class: "IPC Class",
            rohs: "RoHS",
            reach: "REACH",
            halogen_free: "Halogen Free",
            ul_required: "UL Required",
            fai_ppap: "FAI / PPAP",
            ionic_contamination: "Ionic Contamination"
          }
        }
      ];

      let fullHtml = '';

      sectionConfigs.forEach(section => {
        if (!section.data) return;

        fullHtml += `
          <div class="border border-slate-800 bg-slate-900/70 rounded-lg p-3">
            <h3 class="text-xs font-bold text-blue-300 uppercase tracking-wider pb-2 border-b border-slate-800">${section.title}</h3>
            <div class="space-y-2 mt-2">
        `;

        for (const [key, label] of Object.entries(section.labels)) {
          const item = section.data[key] || { value: 'No data', snippet: 'No data' };
          const isNoData = item.value.toLowerCase().includes('no data');

          fullHtml += `
            <div class="text-xs py-1 border-b border-slate-800/40 last:border-0">
              <div class="flex justify-between items-baseline gap-2">
                <span class="text-slate-400 font-medium">${label}</span>
                <span class="${isNoData ? 'text-slate-500' : 'text-emerald-400 font-semibold'} text-right">${item.value}</span>
              </div>
              <div class="mt-0.5 text-[10px] italic p-1.5 bg-slate-950/80 rounded border-l-2 ${isNoData ? 'border-slate-700 text-slate-500' : 'border-emerald-500 text-slate-300'}">
                ${item.snippet}
              </div>
            </div>
          `;
        }

        fullHtml += `</div></div>`;
      });

      document.getElementById('specsContainer').innerHTML = fullHtml;
    }
  </script>
</body>
</html>
