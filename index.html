<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Multi-Spec Inspector Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex h-screen overflow-hidden font-sans">

  <!-- Left: Drawing Viewer -->
  <div class="flex-1 flex flex-col border-r border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
      <input type="file" id="zipInput" accept=".zip" class="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer" />
      <span id="status" class="text-xs text-slate-400">Upload a PCB fabrication zip...</span>
    </div>
    <div id="viewer" class="flex-1 overflow-auto p-4 flex justify-center bg-slate-900">
      <canvas id="pdfCanvas" class="shadow-2xl max-w-full h-auto rounded border border-slate-700"></canvas>
    </div>
  </div>

  <!-- Right: Specs Inspector Panel -->
  <div class="w-[480px] p-6 flex flex-col bg-slate-950 overflow-y-auto">
    <h2 class="text-lg font-bold mb-4 text-blue-400">PCB Spec Inspector</h2>

    <button id="scanBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded font-medium text-sm transition shadow-lg shadow-blue-900/30">
      Extract All PCB Specs
    </button>

    <div id="specsContainer" class="mt-6 border-t border-slate-800 pt-4 space-y-4">
      <div class="text-xs text-slate-500 italic">Upload a zip and click extract to scan specifications.</div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let targetImageBase64 = null;

    // Hardcoded API Key
   const API_KEY = localStorage.getItem('gemini_api_key') || "";

    // 1. Unpack Zip & Render PDF
    document.getElementById('zipInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('status').innerText = 'Unpacking zip...';
      const zip = await JSZip.loadAsync(file);

      const pdfEntry = Object.values(zip.files).find(f => 
        f.name.toLowerCase().endsWith('.pdf') && 
        (f.name.toLowerCase().includes('fab') || f.name.toLowerCase().includes('drawing') || f.name.toLowerCase().includes('dwg'))
      ) || Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.pdf'));

      if (!pdfEntry) {
        document.getElementById('status').innerText = 'No PDF found in zip.';
        return;
      }

      document.getElementById('status').innerText = `Rendering ${pdfEntry.name}...`;
      const pdfData = await pdfEntry.async('arraybuffer');
      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      const page = await pdf.getPage(1);

      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport }).promise;
      targetImageBase64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
      document.getElementById('status').innerText = `Loaded: ${pdfEntry.name}`;
    });

    // 2. Multimodal LLM Extraction
    document.getElementById('scanBtn').addEventListener('click', async () => {
      if (!targetImageBase64) {
        alert('Please upload a zip containing a PDF drawing first.');
        return;
      }

      const container = document.getElementById('specsContainer');
      container.innerHTML = '<div class="text-sm text-blue-400 animate-pulse">Scanning drawing, stackup tables, and fabrication notes...</div>';

      const prompt = `You are an expert PCB manufacturing CAM engineer.
Examine this PCB fabrication drawing (FABRICATION NOTES, LAYER STACK TABLE, and title block) and extract these exact specifications.

Rules:
- If a spec or note is NOT found anywhere in the drawing, set "value" to "No data" and "snippet" to "No data".
- snippets MUST be exact verbatim quotes from the drawing.

Return pure JSON matching this schema:
{
  "part_type": { "value": "e.g. PCB - 2 Layer", "snippet": "verbatim quote or No data" },
  "material": { "value": "e.g. FR-4.0 170Tg, IPC-4101/126, UL94V-0", "snippet": "verbatim quote or No data" },
  "core_and_prepreg": { "value": "e.g. # Cores: 1, # PP Sheets: 0", "snippet": "verbatim quote or No data" },
  "copper_thickness": { "value": "e.g. Outer: 1.0 oz, Inner: N/A", "snippet": "verbatim quote or No data" },
  "board_thickness": { "value": "e.g. 0.062 in (1.59 mm)", "snippet": "verbatim quote or No data" },
  "board_thickness_tol": { "value": "e.g. +/- 10%", "snippet": "verbatim quote or No data" },
  "imbalance_stackup": { "value": "Yes or No", "snippet": "verbatim quote or No data" },
  "bow_and_twist_tol": { "value": "e.g. max 1% or max 0.75%", "snippet": "verbatim quote or No data" }
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: 'image/jpeg', data: targetImageBase64 } }
              ]
            }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(`Google API: ${data.error.message || JSON.stringify(data.error)}`);
        }

        if (!data.candidates || data.candidates.length === 0) {
          throw new Error('No candidates returned from the model.');
        }

        const candidate = data.candidates[0];
        if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
          throw new Error('Model returned an empty body.');
        }

        const parsed = JSON.parse(candidate.content.parts[0].text);
        renderSpecsTable(parsed);

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="p-3 bg-red-950 border border-red-700 text-red-300 text-xs rounded">${err.message}</div>`;
      }
    });

    function renderSpecsTable(specs) {
      const labels = {
        part_type: 'Part Type',
        material: 'Material (Tg / IPC / UL)',
        core_and_prepreg: 'Core & Pre-preg',
        copper_thickness: 'Cu Thickness',
        board_thickness: 'Board Thickness',
        board_thickness_tol: 'Board Thickness Tol.',
        imbalance_stackup: 'Imbalance Stackup',
        bow_and_twist_tol: 'Bow & Twist Tol.'
      };

      let html = '<div class="space-y-3">';
      for (const [key, label] of Object.entries(labels)) {
        const item = specs[key] || { value: 'No data', snippet: 'No data' };
        const isNoData = item.value.toLowerCase().includes('no data');

        html += `
          <div class="border-b border-slate-800 pb-2">
            <div class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">${label}</div>
            <div class="text-sm font-semibold mt-0.5 ${isNoData ? 'text-slate-500' : 'text-emerald-400 font-mono'}">
              ${item.value}
            </div>
            <div class="mt-1 text-[11px] italic p-1.5 rounded bg-slate-900 border-l-2 ${isNoData ? 'border-slate-700 text-slate-500' : 'border-emerald-500 text-slate-300'}">
              ${item.snippet}
            </div>
          </div>
        `;
      }
      html += '</div>';
      document.getElementById('specsContainer').innerHTML = html;
    }
  </script>
</body>
</html>
